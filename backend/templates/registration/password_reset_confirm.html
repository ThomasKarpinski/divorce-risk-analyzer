{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Set New Password" %}{% endblock %}

{% block extra_head %}
<style>
    .reset-container {
        max-width: 500px;
        margin: 2rem auto;
        padding: 2.5rem;
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        text-align: center;
    }
    input {
        width: 100%;
        padding: 0.9rem;
        margin-bottom: 1.3rem;
        border-radius: 10px;
        border: 1px solid #e5e7eb;
        font-size: 1rem;
        box-sizing: border-box;
    }
    button {
        background-color: #ff6b81;
        color: white;
        border: none;
        padding: 1rem 2rem;
        border-radius: 12px;
        cursor: pointer;
        font-size: 1.1rem;
        width: 100%;
    }
    button:hover { background-color: rgb(238, 10, 67); }
    ul { list-style: none; padding: 0; color: #ef4444; font-size: 0.9rem; margin-bottom: 1rem; }
</style>
{% endblock %}

{% block content %}
<div class="reset-container">
    <h1>{% trans "Set New Password" %}</h1>
    <p>{% trans "Please enter your new password below." %}</p>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{% trans "Change Password" %}</button>
    </form>
</div>
{% endblock %}
